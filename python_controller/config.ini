# Digital Bloom Control System Configuration

[WiFi]
# mode: ap (connect to ESP32 hotspot) or sta (connect to existing network)
mode = ap
# When mode=ap: credentials of the ESP32 hotspot to connect to
ap_ssid = ESP32_Sylvie
ap_password = 12345678
# When mode=sta: credentials for existing WiFi
sta_ssid = YOUR_WIFI_SSID
sta_password = YOUR_WIFI_PASSWORD

[Devices]
# Comma-separated list of device names (must match sections below)
device_list = sylvie
# Repeat to add more: device_list = sylvie,sue

[Device_sylvie]
ip = 192.168.4.1
port = 8888
type = dc_motor
description = DC motor flower with RGB LEDs

[Device_sue]
ip = 192.168.4.2
port = 8000
type = servo
description = Servo petal flower with ultrasonic sensor

[Vision]
camera_id = 0
frame_width = 640
frame_height = 480
# emotion backend: deepface or haar (haar is faster, deepface more accurate)
emotion_backend = deepface
# deepface model: VGG-Face, Facenet, OpenFace, DeepFace, DeepID, ArcFace, Dlib, SFace
deepface_model = VGG-Face
# enable pose estimation with mediapipe
enable_pose = true
# minimum face detection confidence
min_face_confidence = 0.5

[Personas]
# Persona labels used in state machine
labels = Empathy,Defensive,Predatory,Boredom,Surprise,Jealous
# Time (seconds) a flower must stay in Empathy to trigger jealousy in others
jealousy_trigger_seconds = 5.0
# Duration (seconds) a flower stays in Jealous after trigger
jealousy_burst_seconds = 8.0
# EMA smoothing factor for motion output (0=no smoothing, 1=frozen)
ema_alpha = 0.3

[ML]
# Path to save/load trained model
model_path = ml_model.pkl
# Training data file
data_path = training_data.json
# Classifier type: random_forest or svm
classifier = random_forest

[Recording]
# Directory to save recorded motion sequences
sequence_dir = sequences
