# Configuration file for Vision PID Control System

[Network]
# ESP32 IP address (update with your ESP32's IP)
esp32_ip = 192.168.1.100
# OSC communication port
esp32_port = 8000

[Camera]
# Camera device ID (usually 0 for built-in webcam)
camera_id = 0
# Frame dimensions
frame_width = 640
frame_height = 480

[Tracking]
# Tracker type: 'face' or 'color'
tracker_type = face

[ColorTracking]
# HSV color range for color tracking (default: red)
# Lower bound (Hue, Saturation, Value)
lower_hsv = 0, 120, 70
# Upper bound (Hue, Saturation, Value)
upper_hsv = 10, 255, 255

[PID_Pan]
# PID parameters for pan (horizontal) control
kp = 0.15
ki = 0.01
kd = 0.05
output_limit = 30

[PID_Tilt]
# PID parameters for tilt (vertical) control
kp = 0.15
ki = 0.01
kd = 0.05
output_limit = 30

[Servo]
# Initial servo positions (degrees)
pan_center = 90
tilt_center = 90
# Servo limits
pan_min = 0
pan_max = 180
tilt_min = 0
tilt_max = 180

[Behavior]
# Time to wait before closing flower when target is lost (seconds)
lost_target_timeout = 2.0
# Flower open/close speed (0.0-1.0 per frame)
flower_speed = 0.05
